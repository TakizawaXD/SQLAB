    <script>
      function reportError(title, err) {
        console.error(title, err);
        var el = document.getElementById('app-loading-msg');
        if (el) {
          var details = (err && (err.stack || err.message || err.reason)) || String(err);
          el.innerHTML = '<div style="color:#f87171;font-weight:bold;margin-bottom:6px;">⚠️ ' + title + '</div>' +
            '<div style="color:#fca5a5;font-size:11px;font-family:monospace;background:#1e1b4b;padding:8px;border-radius:6px;max-width:600px;text-align:left;overflow:auto;max-height:180px;white-space:pre-wrap;border:1px solid #7f1d1d;">' + details + '</div>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="margin-top:10px;padding:6px 14px;background:#7c3aed;color:#fff;font-weight:600;border:none;border-radius:6px;cursor:pointer;font-size:11px;">Limpiar y Recargar</button>';
        }
      }
      window.addEventListener('error', function(e) {
        var target = e && e.target;
        if (target && target !== window && target.tagName !== 'SCRIPT') return;
        var resourceUrl = target && target.src;
        reportError('Error de ejecución en el navegador', e.error || e.message || (resourceUrl ? 'No se pudo cargar el script: ' + resourceUrl : 'Error de carga desconocido'));
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        reportError('Fallo en inicialización asíncrona', e.reason);
      });
      setTimeout(function() {
        if (!window.__SQLAB_BOOTED__ && document.getElementById('app-loading-msg')) {
          reportError(
            'La aplicación está tardando en cargar',
            'Comprueba tu conexión y recarga la página. Si el problema persiste, usa Limpiar y Recargar.'
          );
        }
      }, 20000);
    </script>

            </circle>
          </svg>

        <div id="app-loading-msg" style="font-size:12px;color:#94a3b8;text-align:center;max-width:320px;">Cargando motor de base de datos...</div>
