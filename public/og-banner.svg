<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="purple-glow" cx="80%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyan-glow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f3e8ff"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Cylinder Gradients -->
    <linearGradient id="cyl-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="cyl-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="30%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#purple-glow)"/>
  <rect width="1200" height="630" fill="url(#cyan-glow)"/>

  <!-- Blueprint Grid Pattern -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Left Side: Content & Typography -->
  <g transform="translate(90, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="365" height="34" rx="17" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#10b981"/>
    <text x="32" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1.5">MOTOR POSTGRESQL WEBASSEMBLY</text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="'Inter', sans-serif" font-size="78" font-weight="900" fill="url(#title-grad)" letter-spacing="-1.5">SQL LAB</text>

    <!-- Slogan -->
    <text x="2" y="165" font-family="'Inter', sans-serif" font-size="28" font-weight="600" fill="#38bdf8" letter-spacing="0.5">Aprende. Ejecuta. Construye.</text>

    <!-- Description -->
    <text x="2" y="215" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Laboratorio interactivo de bases de datos PostgreSQL en el navegador.
    </text>
    <text x="2" y="242" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      100% Client-Side con Monaco Editor, Xterm.js y Diagramas ER en tiempo real.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 285)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🐘 PostgreSQL</text>

      <!-- Badge 2 -->
      <rect x="145" y="0" width="115" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="161" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ PGlite</text>

      <!-- Badge 3 -->
      <rect x="270" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="286" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#a855f7">💾 IndexedDB</text>

      <!-- Badge 4 -->
      <rect x="415" y="0" width="150" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="431" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#10b981">🔒 Sin Servidores</text>
    </g>
  </g>

  <!-- Right Side: 3D Holographic Cylinder Graphic -->
  <g transform="translate(910, 310)">
    <!-- Ambient back glow -->
    <circle cx="0" cy="0" r="190" fill="#8b5cf6" opacity="0.25" filter="url(#neon)"/>

    <!-- Orbital ring -->
    <ellipse cx="0" cy="0" rx="200" ry="80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="16 12" opacity="0.6" transform="rotate(-20)"/>
    <circle cx="-160" cy="50" r="6" fill="#38bdf8" filter="url(#neon)"/>
    <circle cx="150" cy="-60" r="7" fill="#a855f7" filter="url(#neon)"/>

    <!-- Disc 3 (Bottom) -->
    <g transform="translate(-110, 30)">
      <path d="M 0 50 C 0 85, 220 85, 220 50 L 220 85 C 220 120, 0 120, 0 85 Z" fill="url(#cyl-body)"/>
      <path d="M 0 85 C 0 120, 220 120, 220 85" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#neon)"/>
    </g>

    <!-- Disc 2 (Middle) -->
    <g transform="translate(-110, -35)">
      <path d="M 0 50 C 0 85, 220 85, 220 50 L 220 85 C 220 120, 0 120, 0 85 Z" fill="url(#cyl-body)"/>
      <path d="M 0 85 C 0 120, 220 120, 220 85" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.8"/>
    </g>

    <!-- Disc 1 (Top) -->
    <g transform="translate(-110, -100)">
      <path d="M 0 50 C 0 85, 220 85, 220 50 L 220 85 C 220 120, 0 120, 0 85 Z" fill="url(#cyl-body)"/>
      <ellipse cx="110" cy="50" rx="110" ry="36" fill="url(#cyl-top)"/>
      <ellipse cx="110" cy="50" rx="75" ry="24" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
      
      <!-- Center code brackets -->
      <path d="M 95 44 L 80 50 L 95 56" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 125 44 L 140 50 L 125 56" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="115" y1="41" x2="105" y2="59" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
